<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Modelos IA locales</title>
<style>
  :root { --bg:#0b1120; --panel:#111a2e; --line:#1f2b45; --text:#e5edf8; --muted:#8ea0bd; --accent:#2dd4bf; --accent2:#38bdf8; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:Inter,system-ui,Segoe UI,Roboto,sans-serif; height:100vh; display:flex; flex-direction:column; }
  header { padding:14px 20px; border-bottom:1px solid var(--line); background:#0d1628; display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
  .brand { font-weight:800; letter-spacing:-.3px; font-size:18px; }
  .brand span { color:var(--accent); }
  select, button, textarea, input { font:inherit; }
  select { background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:9px; padding:9px 12px; min-width:250px; }
  .status { font-size:12px; color:var(--muted); display:flex; align-items:center; gap:6px; }
  .dot { width:8px;height:8px;border-radius:50%; background:#64748b; }
  .dot.up { background:#22c55e; box-shadow:0 0 8px #22c55e88; }
  .dot.down { background:#ef4444; }
  .spacer { flex:1; }
  button { cursor:pointer; border:0; border-radius:9px; padding:9px 14px; background:#1e293b; color:var(--text); }
  button:hover { background:#273449; }
  button.primary { background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#04202a; font-weight:700; }
  button:disabled { opacity:.45; cursor:not-allowed; }
  main { flex:1; display:flex; min-height:0; }
  #chat { flex:1; overflow:auto; padding:24px max(20px,8vw); display:flex; flex-direction:column; gap:14px; }
  .msg { max-width:900px; padding:13px 16px; border-radius:14px; line-height:1.55; white-space:pre-wrap; word-break:break-word; }
  .user { align-self:flex-end; background:#1d4ed8; color:white; border-bottom-right-radius:4px; }
  .assistant { align-self:flex-start; background:var(--panel); border:1px solid var(--line); border-bottom-left-radius:4px; }
  .system-note { align-self:center; color:var(--muted); font-size:12px; }
  .composer { border-top:1px solid var(--line); padding:14px 20px; background:#0d1628; display:flex; gap:10px; align-items:flex-end; }
  textarea { flex:1; resize:none; min-height:52px; max-height:180px; background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:12px; padding:13px 15px; outline:none; }
  textarea:focus { border-color:var(--accent); }
  .hint { color:var(--muted); font-size:11px; padding:0 20px 10px; background:#0d1628; }
  .thinking { color:var(--muted); font-style:italic; }
  @media (max-width:700px) { #chat { padding:16px; } select { min-width:0; width:100%; } .brand { width:100%; } }
</style>
</head>
<body>
<header>
  <div class="brand">Mytarik <span>· Modelos IA</span></div>
  <select id="model" aria-label="Modelo"></select>
  <div class="status"><span id="dot" class="dot"></span><span id="status">Comprobando...</span></div>
  <button id="start" hidden>Iniciar modelo</button>
  <div class="spacer"></div>
  <button id="clear">Limpiar chat</button>
</header>
<main>
  <div id="chat">
    <div class="system-note">Elige un modelo instalado y escribe. El modelo se ejecuta en tu equipo.</div>
  </div>
</main>
<div class="composer">
  <textarea id="input" placeholder="Escribe un mensaje… (Enter para enviar, Shift+Enter para nueva línea)"></textarea>
  <button class="primary" id="send">Enviar</button>
</div>
<div class="hint">Chat local · Los datos no salen de este equipo</div>
<script>
const chat = document.getElementById('chat');
const modelSelect = document.getElementById('model');
const dot = document.getElementById('dot');
const status = document.getElementById('status');
const startBtn = document.getElementById('start');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');
let models = [];
let selected = null;
let messages = [];
let busy = false;

async function loadModels() {
  const res = await fetch('/api/models');
  models = await res.json();
  modelSelect.innerHTML = '';
  models.forEach(m => {
    const opt = document.createElement('option');
    opt.value = m.id;
    opt.textContent = `${m.name} ${m.up ? '· listo' : '· detenido'}`;
    modelSelect.appendChild(opt);
  });
  if (!selected && models.length) selected = models[0].id;
  if (selected) modelSelect.value = selected;
  updateStatus();
}

function updateStatus() {
  const m = models.find(x => x.id === selected);
  if (!m) return;
  dot.className = 'dot ' + (m.up ? 'up' : 'down');
  status.textContent = m.up ? 'Modelo listo' : 'Modelo detenido';
  startBtn.hidden = m.up;
}

function add(role, text) {
  const div = document.createElement('div');
  div.className = 'msg ' + (role === 'user' ? 'user' : 'assistant');
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

async function send() {
  if (busy) return;
  const text = input.value.trim();
  if (!text) return;
  const m = models.find(x => x.id === selected);
  if (!m) return;
  if (!m.up) { add('assistant', 'El modelo está detenido. Pulsa “Iniciar modelo”.'); return; }
  input.value = '';
  messages.push({ role: 'user', content: text });
  add('user', text);
  const thinking = add('assistant', 'Pensando…');
  thinking.classList.add('thinking');
  busy = true; sendBtn.disabled = true;
  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ model_id: selected, messages, temperature: 0.1, max_tokens: 4096 })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || 'Error');
    messages.push({ role: 'assistant', content: data.content });
    thinking.classList.remove('thinking');
    thinking.textContent = data.content || '(respuesta vacía)';
  } catch (err) {
    thinking.classList.remove('thinking');
    thinking.textContent = 'Error: ' + err.message;
    messages.pop();
  } finally {
    busy = false; sendBtn.disabled = false; chat.scrollTop = chat.scrollHeight;
  }
}

modelSelect.addEventListener('change', () => { selected = modelSelect.value; updateStatus(); });
startBtn.addEventListener('click', async () => {
  startBtn.disabled = true;
  startBtn.textContent = 'Arrancando…';
  try {
    const res = await fetch('/api/start/' + encodeURIComponent(selected), {method:'POST'});
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || 'No se pudo arrancar');
    await loadModels();
  } catch (err) { add('assistant', 'Error: ' + err.message); }
  finally { startBtn.disabled = false; startBtn.textContent = 'Iniciar modelo'; }
});
sendBtn.addEventListener('click', send);
input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
document.getElementById('clear').addEventListener('click', () => {
  messages = [];
  chat.innerHTML = '<div class="system-note">Chat limpio. Elige un modelo y escribe.</div>';
});
loadModels();
</script>
</body>
</html>
