worker_processes auto;
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;
  client_max_body_size 32m;

  server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback
    location / {
      try_files $uri $uri/ /index.html;
    }

    # Proxy del backend FastAPI.
    # Sin trailing slash en proxy_pass → nginx reenvía la URI tal cual,
    # así /api/health del cliente llega como /api/health al backend.
    location /api/ {
      proxy_pass         http://webapp-backend:8000;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_read_timeout 660s;
      proxy_send_timeout 120s;
      proxy_buffering off;

      # uploads grandes
      client_max_body_size 32m;
    }

    # No cachear index.html para que los nuevos builds se vean al refrescar
    location = /index.html {
      add_header Cache-Control "no-cache, no-store, must-revalidate";
      expires 0;
    }

    # Healthcheck simple del propio nginx (no toca al backend).
    # Útil para docker healthcheck / Front Door probes / k8s liveness.
    location = /healthz {
      access_log off;
      add_header Content-Type application/json always;
      return 200 '{"status":"healthy","service":"mytarik-webapp-frontend"}';
    }

    # Healthcheck "deep": nginx OK + proxy al /api/health del backend.
    # Si el backend está caído, devuelve 502.
    location = /healthz/deep {
      access_log off;
      add_header Content-Type application/json always;
      proxy_pass         http://webapp-backend:8000/api/health;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_read_timeout 5s;
      proxy_connect_timeout 2s;
    }
  }
}
